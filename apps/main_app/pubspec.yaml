name: aumazing
description: "Aumazing — ASD-friendly educational assessment app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  # ── Shared packages ──────────────────────────────────────────────────
  game_core:
    path: ../../packages/game_core
  shared_ui:
    path: ../../packages/shared_ui
  shared_audio:
    path: ../../packages/shared_audio
  shared_haptic:
    path: ../../packages/shared_haptic
  # ── App dependencies ─────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flame: ^1.30.1
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  supabase_flutter: ^2.12.2
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.1
  flutter_svg: ^2.0.17
  google_fonts: ^6.3.2
  video_player: ^2.9.3
  connectivity_plus: ^6.1.3
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  flutter_dotenv: ^5.2.1
  http: ^1.2.0
  # Salted PBKDF2 hashing for the parent-lock PIN (see ParentPinService).
  crypto: ^3.0.3
  # On-device AI inference (XGBoost exported to ONNX, run via ONNX Runtime).
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Virtual clock for timer-driven widget logic (e.g. the mascot's pose revert).
  fake_async: ^1.3.1
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.1
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# App launcher icon (star + child + puzzle rainbow artwork).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon_full.png
  android: true
  # Adaptive icon: white background, padded artwork in the safe zone so
  # circular masks don't crop the star or the puzzle rainbow.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/app_icon_full.png
  linux:
    generate: true
    image_path: assets/icon/app_icon_full.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/videos/
    # On-device AI model artifacts (generated by training/export_onnx.py).
    - assets/models/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
