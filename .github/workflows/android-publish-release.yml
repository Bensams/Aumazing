name: Android Publish Release

# Manual only: click "Run workflow" on the dev/main branch you want to ship
# and choose whether this build should have Premium unlocked for everyone.
on:
  workflow_dispatch:
    inputs:
      unlock_premium:
        description: 'Unlock Premium features for everyone in this build?'
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub Release as a draft (review before publishing)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=UNLOCK_PREMIUM_FEATURES=${{ inputs.unlock_premium }}

      - name: Remove keystore secrets from workspace
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Determine release metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          TAG="v${VERSION%%+*}-run${{ github.run_number }}"
          PREMIUM_LABEL=$([ "${{ inputs.unlock_premium }}" = "true" ] && echo "Premium unlocked (promo build)" || echo "Standard (Premium gated by entitlement)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "premium_label=$PREMIUM_LABEL" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aumazing ${{ steps.meta.outputs.tag }}
          draft: ${{ inputs.draft }}
          body: |
            Aumazing ${{ steps.meta.outputs.version }} expands assessment reporting, child personalization,
            guided activities, and the in-game reward experience.

            ## Features added

            - Added richer assessment reports with saved rubric details,
              recommendations, and pre/post comparisons in the app and beta portal.
            - Recommended activities can now open My Path directly, and the
              pre-assessment summary uses a dedicated full-screen parent handoff.
            - Child settings, buddy, character, and costume selections now persist
              and sync, with the chosen mascot shown across the child experience.
            - Added a clearly labelled simulated checkout flow for Premium testing.
            - Expanded gameplay feedback with an interactive victory trophy,
              star and trophy sounds, spoken reward hints, and Trace It shape glyphs.
            - Added multilingual Kumusta greeting voice-over and new high-five and
              fist-bump gesture sheets for every character skin.
            - Simplified sign-in by removing the Facebook option and SDK.

            ## Fixes

            - Restored Gemini assessment summaries and preserved recommendations,
              rubric data, and pre/post comparisons through result handoffs.
            - Corrected assessment cloud synchronization and reconstruction of
              per-game results from uploaded assessment rows.
            - Fixed parent-summary orientation and assessment/history card overlaps.
            - Fixed My Path victories returning to the dashboard instead of the
              child lobby, plus several stranded end-of-game transitions.
            - Fixed voice-over continuing after focus loss, truncated English
              instructions, and silent Kumusta hard-mode reorientation.
            - Prevented cloud data from overwriting character and costume choices,
              and refreshed the mascot immediately after a selection change.
            - Fixed sensory-consent label wrapping, dialog underline artifacts,
              and mismatched buddy drag targets.

            ## Build details

            - App version: ${{ steps.meta.outputs.version }}
            - Source: ${{ github.ref_name }} @ ${{ github.sha }}
            - Premium: ${{ steps.meta.outputs.premium_label }}
          files: apps/main_app/build/app/outputs/flutter-apk/app-release.apk
