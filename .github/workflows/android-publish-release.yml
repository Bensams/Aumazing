name: Android Publish Release

# Manual only: click "Run workflow" on the dev/main branch you want to ship
# and choose whether this build should have Premium unlocked for everyone.
on:
  workflow_dispatch:
    inputs:
      unlock_premium:
        description: 'Unlock Premium features for everyone in this build?'
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub Release as a draft (review before publishing)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=UNLOCK_PREMIUM_FEATURES=${{ inputs.unlock_premium }}

      - name: Remove keystore secrets from workspace
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Determine release metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          TAG="v${VERSION%%+*}-run${{ github.run_number }}"
          PREMIUM_LABEL=$([ "${{ inputs.unlock_premium }}" = "true" ] && echo "Premium unlocked (promo build)" || echo "Standard (Premium gated by entitlement)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "premium_label=$PREMIUM_LABEL" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aumazing ${{ steps.meta.outputs.tag }}
          draft: ${{ inputs.draft }}
          body: |
            Aumazing ${{ steps.meta.outputs.version }} makes assessment progress
            easier for parents to understand and improves wireless development reliability.

            ## Features added

            - Reorganized parent assessment summaries around Communication,
              Play Skills, Social Interaction, and Attention & Focus instead of
              exposing individual game names as the primary interpretation.
            - Kept supporting activity percentages visible alongside the
              parent-friendly skill bands, with unavailable evidence clearly labelled.
            - Updated Advanced Trends to compare pre- and post-assessment skill
              domains, showing percentage-point movement separately from band changes.

            ## Fixes

            - Made the wireless runner automatically match an attached USB phone
              to its rotating Android wireless-debugging endpoint.
            - Made wireless connection checks use the live ADB device state and
              wait for the phone's TCP listener instead of relying on fixed timing.
            - Added clearer guidance when Wi-Fi client isolation prevents the PC
              from reaching the phone.

            ## Build details

            - App version: ${{ steps.meta.outputs.version }}
            - Source: ${{ github.ref_name }} @ ${{ github.sha }}
            - Premium: ${{ steps.meta.outputs.premium_label }}
          files: apps/main_app/build/app/outputs/flutter-apk/app-release.apk
