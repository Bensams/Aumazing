name: Android Publish Release

# Manual only: click "Run workflow" on the dev/main branch you want to ship
# and choose whether this build should have Premium unlocked for everyone.
on:
  workflow_dispatch:
    inputs:
      unlock_premium:
        description: 'Unlock Premium features for everyone in this build?'
        type: boolean
        default: false
      draft:
        description: 'Create the GitHub Release as a draft (review before publishing)'
        type: boolean
        default: true
      parent_notes:
        description: 'One or two plain sentences for parents, shown in the in-app update dialog (can also be written on the draft)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Google Sign-In build configuration
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Repository secret GOOGLE_WEB_CLIENT_ID must be set for Android release builds."
            exit 1
          fi

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=UNLOCK_PREMIUM_FEATURES=${{ inputs.unlock_premium }}

      - name: Rename package to aumazing.apk
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/aumazing.apk

      - name: Remove keystore secrets from workspace
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Determine release metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          TAG="v${VERSION%%+*}-run${{ github.run_number }}"
          PREMIUM_LABEL=$([ "${{ inputs.unlock_premium }}" = "true" ] && echo "Premium unlocked (promo build)" || echo "Standard (Premium gated by entitlement)")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "premium_label=$PREMIUM_LABEL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum build/app/outputs/flutter-apk/aumazing.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Explain the in-app update to the job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## In-app update

          Publishing this release runs **Android Register Release**, which adds
          its \`public.app_releases\` row so installed copies offer the update.
          The release notes' first paragraph is what parents see in the update
          dialog, so make sure it is written for them before publishing.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aumazing ${{ steps.meta.outputs.tag }}
          draft: ${{ inputs.draft }}
          # The first paragraph is shown to parents in the in-app update
          # dialog. Android Register Release refuses to publish the placeholder.
          body: |
            ${{ inputs.parent_notes || 'Replace this paragraph with one or two plain sentences for parents before publishing. It is shown in the app''s update dialog.' }}

            ## Changes

            - Describe each change here.

            ## Build details

            - App version: ${{ steps.meta.outputs.version }}
            - Source: ${{ github.ref_name }} @ ${{ github.sha }}
            - Premium: ${{ steps.meta.outputs.premium_label }}
            - SHA-256: ${{ steps.meta.outputs.sha256 }}
          files: apps/main_app/build/app/outputs/flutter-apk/aumazing.apk

  # A release this workflow publishes itself raises no release event, so it
  # registers the in-app update directly. Drafts register when published.
  register:
    needs: build-and-release
    if: ${{ !inputs.draft }}
    uses: ./.github/workflows/android-register-release.yml
    with:
      tag: ${{ needs.build-and-release.outputs.tag }}
    secrets:
      APP_RELEASE_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
