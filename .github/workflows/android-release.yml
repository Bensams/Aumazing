name: Android Release Evidence

on:
  pull_request:
    paths:
      - 'apps/main_app/**'
      - 'packages/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    defaults:
      run:
        working-directory: apps/main_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify Google Sign-In build configuration
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Repository secret GOOGLE_WEB_CLIENT_ID must be set for Android release builds."
            exit 1
          fi
      - name: Analyze application
        # Infos are deprecation/style notices, not correctness issues, and
        # accumulate naturally as Flutter/packages evolve; only warnings and
        # errors should fail the build.
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        # Several widget tests trigger a 4s native-audio backstop timer
        # (VoiceOverService/AudioService); flutter test's default parallel
        # isolate concurrency races those timers against test teardown,
        # failing a different, nondeterministic set of tests each run.
        run: flutter test --concurrency=1
      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Build release app bundle
        run: flutter build appbundle --release --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Rename packages to aumazing
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/aumazing.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/aumazing.aab
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aumazing-android-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/main_app/build/app/outputs/flutter-apk/aumazing.apk
            apps/main_app/build/app/outputs/bundle/release/aumazing.aab
