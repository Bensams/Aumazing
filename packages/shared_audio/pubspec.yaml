name: shared_audio
description: Audio helpers, volume settings, and sound services for Aumazing.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

flutter:
  assets:
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/sfx/rewards/
    # ── English voice-overs ──────────────────────────────────────────
    - assets/audio/voice_over/en/assessment_style/
    - assets/audio/voice_over/en/attention_and_regulation/
    - assets/audio/voice_over/en/core_praise/
    - assets/audio/voice_over/en/gently_retry/
    - assets/audio/voice_over/en/instruction/
    - assets/audio/voice_over/en/reward_and_celebration/
    - assets/audio/voice_over/en/transition/
    - assets/audio/voice_over/en/turn_taking/
    - assets/audio/voice_over/en/dynamic/
    - assets/audio/voice_over/en/colors/
    - assets/audio/voice_over/en/shapes/
    # ── Tagalog voice-overs ──────────────────────────────────────────
    - assets/audio/voice_over/tl/assessment_style/
    - assets/audio/voice_over/tl/attention_and_regulation/
    - assets/audio/voice_over/tl/core_praise/
    - assets/audio/voice_over/tl/gently_retry/
    - assets/audio/voice_over/tl/instruction/
    - assets/audio/voice_over/tl/reward_and_celebration/
    - assets/audio/voice_over/tl/transition/
    - assets/audio/voice_over/tl/turn_taking/
    - assets/audio/voice_over/tl/dynamic/
    - assets/audio/voice_over/tl/colors/
    - assets/audio/voice_over/tl/shapes/
    # ── Cebuano (Bisaya) voice-overs ─────────────────────────────────
    - assets/audio/voice_over/ceb/assessment_style/
    - assets/audio/voice_over/ceb/attention_and_regulation/
    - assets/audio/voice_over/ceb/core_praise/
    - assets/audio/voice_over/ceb/gently_retry/
    - assets/audio/voice_over/ceb/instruction/
    - assets/audio/voice_over/ceb/reward_and_celebration/
    - assets/audio/voice_over/ceb/transition/
    - assets/audio/voice_over/ceb/turn_taking/
    - assets/audio/voice_over/ceb/dynamic/
    - assets/audio/voice_over/ceb/colors/
    - assets/audio/voice_over/ceb/shapes/
