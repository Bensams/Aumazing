name: shared_audio
description: Audio helpers, volume settings, and sound services for Aumazing.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/sfx/rewards/
    # ── Background music, one folder per parent-selectable category ────
    # Written by tools/bgm_gen/install_bgm.py; track list mirrored in
    # lib/src/bgm_library.dart. See docs/asd-friendly-bgm.md.
    - assets/audio/bgm/soft_relaxing/
    - assets/audio/bgm/nature_ambient/
    - assets/audio/bgm/gentle_playful/
    - assets/audio/bgm/lullaby_music_box/
    - assets/audio/bgm/focus_minimal/
    - assets/audio/bgm/filipino_calm/
    # `letters/`, `numbers/` and `items/` are the naming cues played back on a
    # correct answer. install_packs.py writes them for the generated packs.
    # ceb_lexianne is human-recorded and has none — it is not a default, so it
    # falls back to ceb_adult_woman.
    #
    # The original en / tl / ceb packs are gone: each was stitched from several
    # speakers, so the voice could change mid-session.
    # ── Cebuano "Lexianne" voice pack (human-recorded) ────────────────
