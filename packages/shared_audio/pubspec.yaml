name: shared_audio
description: Audio helpers, volume settings, and sound services for Aumazing.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

flutter:
  assets:
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/sfx/rewards/
    - assets/audio/voice_over/assessment_style/
    - assets/audio/voice_over/attention_and_regulation/
    - assets/audio/voice_over/core_praise/
    - assets/audio/voice_over/gently_retry/
    - assets/audio/voice_over/instruction/
    - assets/audio/voice_over/reward_and_celebration/
    - assets/audio/voice_over/transition/
    - assets/audio/voice_over/turn_taking/
    - assets/audio/voice_over/dynamic/
    - assets/audio/voice_over/colors/
    - assets/audio/voice_over/shapes/
