name: shared_ui
description: Reusable theme, widgets, and UI utilities for the Aumazing app ecosystem.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  # Per-game logo tiles are vector art (see assets/game_logos/).
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/characters/
    # Space-world art: the spaceship sprite flown across the Night Sky world
    # during game transitions (see spaceship_transition.dart). Generated by
    # scripts/generate_spaceship.py; a missing file degrades to a drawn rocket.
    - assets/worlds/
    # Costume artwork for the Star Shop, resized and palettised from the
    # full-resolution sources by scripts/bundle_costume_art.py. The sources in
    # packages/assets/ are NOT bundled — that folder has no pubspec.
    - assets/costumes/
    - assets/game_logos/
    # Routine picture cards for Ano'ng Susunod?. Transparent PNGs, trimmed and
    # re-padded to a square so every card composes identically.
    - assets/routine_cards/
    # Emotion faces, situation scenes and caring-response cards for
    # Ano'ng Nararamdaman?. Same treatment as the routine cards.
    - assets/emotion_cards/
    # Seed object bank — reusable drawn picture cards of everyday objects
    # (animals, later fruits/toys/…) plus their en/tl/ceb naming voice lines,
    # indexed by seed_cards/seeds.json. Self-contained: cards, audio and the
    # manifest all resolve against assets/seed_cards/. Written by
    # scripts/generate_seed_cards.py and scripts/generate_seed_lines.py.
    - assets/seed_cards/
    - assets/seed_cards/animals/
    - assets/seed_cards/fruits/
    - assets/seed_cards/toys/
    - assets/seed_cards/food/
    - assets/seed_cards/essentials/
    - assets/seed_cards/audio/en/
    - assets/seed_cards/audio/tl/
    - assets/seed_cards/audio/ceb/