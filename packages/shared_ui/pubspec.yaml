name: shared_ui
description: Reusable theme, widgets, and UI utilities for the Aumazing app ecosystem.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  # Per-game logo tiles are vector art (see assets/game_logos/).
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/characters/
    - assets/game_logos/